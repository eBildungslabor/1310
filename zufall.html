<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zufallsidee – Prüfungsformate mit KI</title>
<style>
  :root { --bg:#fff; --ink:#111; --muted:#8a8a8a; --line:#e4e4e4; --accent:#2f5bea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  nav { display:flex; gap:20px; font-size:.9rem; flex-wrap:wrap; padding:24px 16px 0; max-width:1100px; width:100%; margin:0 auto; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a:hover, nav a.on { color:var(--ink); }
  nav a.on { font-weight:600; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:1100px; width:100%; margin:0 auto; padding:4vh 16px 6vh; }
  .label { font-size:.85rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); }
  .card { margin-top:3vh; border-top:4px solid var(--ink); padding-top:3vh; transition:opacity .25s ease, transform .25s ease; }
  .card.out { opacity:0; transform:translateY(8px); }
  .num { font-size:clamp(.9rem,1.4vw,1.1rem); color:var(--muted); font-variant-numeric:tabular-nums; }
  h1 { font-size:clamp(2.2rem,6vw,5rem); letter-spacing:-.025em; line-height:1.05; margin-top:1vh; }
  .desc { margin-top:3vh; font-size:clamp(1.1rem,2.2vw,1.8rem); line-height:1.45; color:#222; max-width:900px; }
  .tags { display:flex; gap:8px; margin-top:3vh; flex-wrap:wrap; }
  .tags span { font-size:.9rem; border:2px solid var(--accent); color:var(--accent); border-radius:999px; padding:.2em .9em; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6vh; }
  .next { font:inherit; font-size:1.1rem; font-weight:600; background:var(--ink); color:#fff; border:2px solid var(--ink); border-radius:999px; padding:.7em 1.6em; cursor:pointer; }
  .next:hover { background:var(--accent); border-color:var(--accent); }
  .f { font:inherit; font-size:.95rem; border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:.5em 1.1em; cursor:pointer; }
  .f:hover { border-color:var(--ink); }
  .f[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .hint { margin-left:auto; font-size:.85rem; color:var(--muted); }
  @media (max-width:640px) { .hint { margin-left:0; width:100%; } }
</style>
</head>
<body>
<nav>
  <a href="index.html">Übersicht</a>
  <a href="praesentation.html">1 Präsentation</a>
  <a href="formatspinne.html">2 Formatspinne</a>
  <a href="prompt.html">3 Prompt-Generator</a>
  <a href="formate.html">4 Formate</a>
  <a href="zufall.html" class="on">Zufallsidee</a>
</nav>

<main>
  <div class="label">Zufallsidee · Prüfungsformat mit KI</div>
  <article class="card" id="card" aria-live="polite">
    <div class="num" id="num"></div>
    <h1 id="name"></h1>
    <p class="desc" id="desc"></p>
    <div class="tags" id="tags"></div>
  </article>

  <div class="controls">
    <button class="next" id="next" type="button">Nächste Idee</button>
    <button class="f" type="button" data-f="alle" aria-pressed="true">Alle</button>
    <button class="f" type="button" data-f="mit" aria-pressed="false">mit KI</button>
    <button class="f" type="button" data-f="ohne" aria-pressed="false">ohne KI</button>
    <button class="f" type="button" data-f="über" aria-pressed="false">über KI</button>
    <span class="hint">Leertaste = nächste Idee · F = Vollbild</span>
  </div>
</main>

<script src="formate-daten.js"></script>
<script>
  var filter = "alle", deck = [], current = -1;

  function pool() {
    var ids = [];
    F.forEach(function (f, i) { if (filter === "alle" || f[2].indexOf(filter) > -1) ids.push(i); });
    return ids;
  }
  // Gemischter Stapel: alle Ideen kommen dran, bevor sich eine wiederholt
  function shuffle() {
    deck = pool();
    for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    if (deck.length > 1 && deck[deck.length - 1] === current) { var t2 = deck[0]; deck[0] = deck[deck.length - 1]; deck[deck.length - 1] = t2; }
  }
  function show(i) {
    var f = F[i], card = document.getElementById("card");
    card.classList.add("out");
    setTimeout(function () {
      current = i;
      document.getElementById("num").textContent = String(i + 1).padStart(2, "0") + " / " + F.length;
      document.getElementById("name").textContent = f[0];
      document.getElementById("desc").textContent = f[1];
      document.getElementById("tags").innerHTML = f[2].map(function (t) { return "<span>" + t + " KI</span>"; }).join("");
      card.classList.remove("out");
    }, 180);
  }
  function next() {
    if (!deck.length) shuffle();
    show(deck.pop());
  }

  document.getElementById("next").addEventListener("click", next);
  Array.prototype.forEach.call(document.querySelectorAll(".f"), function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.f;
      Array.prototype.forEach.call(document.querySelectorAll(".f"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      deck = []; next();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); next(); }
    else if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen && document.exitFullscreen(); }
    }
  });
  next();
</script>
</body>
</html>
